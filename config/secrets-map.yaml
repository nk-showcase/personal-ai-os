# Service-to-secret access map. NAMES ONLY. Real values live in Bitwarden Secrets Manager.
# Principle of least privilege: a service sees only the secrets listed for it.
# This file is committed to git. Secret values are NEVER written here.

services:
  telegram-bot:
    # Most exposed surface (open on Telegram). Holds the MINIMUM - only its own token.
    allowed_secrets:
      - TELEGRAM_BOT_TOKEN

  claude-worker:
    # Coding worker. Signs in to Claude Code (subscription) - the OAuth token lives in Bitwarden.
    allowed_secrets:
      - GITHUB_REPO_WRITE_TOKEN   # dedicated worker token, scoped strictly to the required repository
      - ANTHROPIC_API_KEY         # for direct SDK calls, not for the CLI
      - CLAUDE_CODE_OAUTH_TOKEN   # Claude Code CLI/SDK subscription sign-in (claude setup-token, ~1 year TTL); NO_DISK_CACHE

  integrations-worker:
    allowed_secrets:
      - NOTION_API_KEY
      - TODOIST_API_KEY
      - TELEGRAM_BOT_TOKEN        # the worker sends operator-facing views to Telegram itself (granted via an operator button)
      - ANTHROPIC_API_KEY         # LLM operations run here (keyed per-service)

non_secret_env:
  # NOT secrets: identifiers and settings. Leaking them grants no access (these are not credentials).
  # They live as ordinary service env vars (systemd Environment= / EnvironmentFile=), NOT in Bitwarden.
  # Values are not written here - names only.
  required:
    - TELEGRAM_OWNER_ID        # numeric Telegram id of the operator; access control, not a credential.
                               # Service telegram-bot. Without it bot/config.py fails (raise ValueError).
                               # Must be present in the telegram-bot service env.
  optional_has_code_default:   # read via os.getenv with a fallback in bot/config.py / bot/claude_bridge.py - absence does not fail startup
    - NOTION_DOMAIN_A_DB       # example Notion database id, read from env (identifier, not a secret)
    - NOTION_DOMAIN_B_DB       # example Notion database id, read from env (identifier, not a secret)
    - NOTION_CLAUDE_CHATS_DB
    - NOTION_CLAUDE_MEMORY_PAGE
    - BRIDGE_GIT_NAME
    - BRIDGE_GIT_EMAIL
    - BRIDGE_MODEL
    - BRIDGE_PROJECTS
  runtime_loader:              # settings for the secrets layer (bot/secrets_loader.py)
    - AIOS_SECRETS_BACKEND     # env (dev/test) | bitwarden (production runtime fetch)
    - AIOS_SECRETS_CACHE_DIR   # on-disk cache path (default ~/.ai-os/secrets-cache)
    - AIOS_SERVICE_NAME        # service name (telegram-bot|claude-worker|integrations-worker).
                               # Set -> get_secret is fail-closed against services.*.allowed_secrets.
                               # Unset -> the allowlist check is disabled.
    - AIOS_CONTEXT_ENCRYPTION  # enable/disable at-rest context encryption (default OFF; not a secret).
    - AIOS_CONTEXT_IDENTITY_FILE  # path to the worker-only age identity (not the key value; not a secret).
    - AIOS_CONTEXT_ALLOW_TEST_KEK # dev/test ONLY: allows injecting a test KEK (default off).
    - AIOS_ROUTER_ENCRYPT      # enable/disable encryption of the router intake pipe (default OFF; not a secret).
    - AIOS_ROUTER_IDENTITY_FILE # path to the worker-only router age identity (not a secret; a file, NOT in allowed_secrets/disk-cache).
    - AIOS_ROUTER_DISPATCH     # enable/disable worker-side execution of the real intent handler (slice-1; default OFF; not a secret).
    # BWS_ACCESS_TOKEN - Bitwarden machine token, NOT ordinary config: provisioned securely per-service (see bitwarden-setup-checklist.md).

local_only:
  claude_code_credentials:
    location: "${AIOS_HOME}/.claude/"
    file: "${AIOS_HOME}/.claude/.credentials.json"   # read only by claude-worker (HOME=${AIOS_HOME})
    owner: "aios:aios"
    dir_mode: "0700"
    file_mode: "0600"
    setup_doc: "docs/security/claude-code-credential-setup.md"  # path/permissions/manual steps, no values
    rule: "The Claude Code account lives ONLY on the <VPS_HOST> disk. Never in git, prompt, Bitwarden, or secrets-cache unless deliberately revisited."

planned_future:
  # RESERVED names of future secrets ONLY. Not provisioned in Block 5, no KDB is built.
  # This block is intentionally NOT under services/non_secret_env - the inventory tool
  # (vps_bitwarden_inventory_check.sh) does not read it as an active secret.
  context_store_identity:
    name: CONTEXT_STORE_IDENTITY        # semantic synonym: CONTEXT_KDB_MASTER_KEY
    purpose: "private decryption identity for the future encrypted context store (KDB)"
    decryption_boundary: "only the future context/claude-worker; telegram-bot NEVER receives this key"
    planned_location: "reuse the claude-worker Bitwarden machine account (no extra paid 4th account)"
    status: "NOT provisioned in Block 5 - placeholder only"

forbidden_everywhere:
  # None of these may exist for any service, nor in the bots' Bitwarden machine accounts.
  - RECOVERY_CODES
  - MASTER_PASSWORDS
  - BANKING_OTP
  - PERSONAL_PASSWORDS
  - PREVIOUS_HOSTING_MASTER_TOKEN

resilience:
  # last-known-good cache - availability fallback ONLY, not the primary store. Full: docs/security/secrets-management.md
  source_of_truth: bitwarden          # the vault is always primary; the cache is never a replacement
  in_memory_cache: allowed            # an in-process memory cache is fine
  on_disk_cache:
    allowed_for:                      # only runtime secrets of ordinary services
      - TELEGRAM_BOT_TOKEN
      - NOTION_API_KEY
      - TODOIST_API_KEY
      - ANTHROPIC_API_KEY
    forbidden_for:                    # never on disk
      - MASTER_PASSWORDS
      - RECOVERY_CODES
      - BANKING_OTP
      - PERSONAL_PASSWORDS
      - PREVIOUS_HOSTING_MASTER_TOKEN
    excluded:                         # not cached as an ordinary secret at all
      - CLAUDE_CODE_OAUTH_TOKEN  # Claude Code subscription sign-in in Bitwarden; crown jewel - NEVER on disk
      - CONTEXT_STORE_IDENTITY   # KEK identity - worker-only age file, NEVER in disk-cache/Bitwarden
      - CONTEXT_KDB_MASTER_KEY   # synonym for CONTEXT_STORE_IDENTITY (see planned_future)
    per_service: true                 # a separate cache file per service, NOT one shared file
    file_owner: service_user_only     # file access - only the relevant service user
    store_timestamp: true             # store the time of the last successful refresh from Bitwarden
    never_in: [git, logs, prompts, CLAUDE.md]
  on_secret_store_unreachable: "use the last known on-disk/in-memory cache and MUST warn the operator; do NOT crash"
  stale_cache: "if the cache is too old -> degraded mode and warn the operator"
  tradeoff: "the cache improves reliability (the bot does not crash when Bitwarden is unreachable) BUT increases risk: some secrets rest on the <VPS_HOST> disk."

notes:
  bitwarden_free_tier: "Free tier = 3 machine accounts. 3 services = exactly at the limit, no headroom. A 4th service would require a paid plan - keep this in mind."
